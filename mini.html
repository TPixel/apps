<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinyl Mini</title>
<link rel="icon" type="image/png" href="plader-favicon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
:root{--acc:#E8820A;--bg:#0d0d11;--mut:#8a8a96}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Tahoma,sans-serif;font-weight:bold;overflow:hidden}
body{display:flex;flex-direction:column;padding:30px 12px 8px;gap:10px}
.bg{position:fixed;inset:-20%;background:center/cover no-repeat;filter:blur(40px) brightness(.28) saturate(1.3);opacity:0;transition:opacity 1s;z-index:-1}
.bg.on{opacity:1}
/* Afspiller */
.top{display:flex;gap:12px;align-items:stretch}
.cov{flex:0 0 auto;width:96px;height:96px;border-radius:8px;background:#1c1c24 center/cover no-repeat;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#3a3a44;font-size:30px}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:13px;color:#e4e4ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.al{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.12);cursor:pointer;position:relative;margin-top:6px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:2px;width:0}
.ctrl{display:flex;align-items:center;gap:6px;margin-top:6px}
.ctrl button{background:rgba(255,255,255,.08);border:none;color:#fff;border-radius:50%;width:30px;height:30px;font-size:12px;cursor:pointer;flex:0 0 auto}
.ctrl button.big{background:var(--acc);width:34px;height:34px;font-size:13px}
.ctrl button:active{transform:scale(.92)}
.vol{flex:1;min-width:50px;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.15);outline:none;margin-left:4px}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff}
.tm{font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
/* Hylde */
.tabs{display:flex;gap:5px;align-items:center}
.tabs button{background:rgba(255,255,255,.07);border:none;color:#9a9aa6;border-radius:12px;padding:5px 10px;font-size:11px;font-family:inherit;font-weight:bold;cursor:pointer;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.tabs button.on{background:var(--acc);color:#fff}
.tabs input{flex:1;min-width:60px;background:rgba(255,255,255,.08);border:none;border-radius:12px;padding:5px 10px;color:#fff;font-size:12px;font-family:inherit;font-weight:bold;outline:none;-webkit-user-select:text;user-select:text}
.tabs input:focus{background:rgba(255,255,255,.14)}
.strip{display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;flex:1;min-height:0;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.strip::-webkit-scrollbar{height:5px}.strip::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.tile{flex:0 0 auto;width:84px;cursor:pointer}
.tile .c{width:84px;height:84px;border-radius:6px;background:#1c1c24 center/cover no-repeat;display:flex;align-items:flex-end;padding:5px;font-size:10px;color:#ccc;line-height:1.2;overflow:hidden}
.tile .c.now{outline:2px solid var(--acc)}
.tile.busy .c{opacity:.4}
.tile:hover .c{filter:brightness(1.15)}
.tile .n{font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:9px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{font-size:11px;color:#77778a;font-weight:normal;padding:6px 2px}
/* Pladevisning: kun drejende plade + titel */
.mode{position:fixed;top:5px;right:8px;z-index:5;background:rgba(255,255,255,.08);border:none;color:#aaa;border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer;font-family:inherit}
.mode:hover{color:#fff;background:rgba(255,255,255,.16)}
#plate{display:none;flex:1;min-height:0;flex-direction:column;align-items:center;justify-content:center;gap:10px}
body.plate .top,body.plate .tabs,body.plate .strip{display:none}
body.plate #plate{display:flex}
body.plate{padding:28px 10px 10px}
.disc{--s:min(calc(100vw - 24px),calc(100vh - 110px));width:var(--s);height:var(--s);border-radius:50%;position:relative;cursor:pointer;flex:0 0 auto;will-change:transform;
  background:radial-gradient(circle at 50% 50%,#0c0c0e 0 17.5%,#2a2a2e 17.6% 18.1%,transparent 18.3%),repeating-radial-gradient(circle at 50% 50%,#131316 0,#131316 1.4px,#1d1d21 1.4px,#1d1d21 2.2px,#16161a 2.2px,#16161a 3px),#141417;
  box-shadow:0 0 0 2px #0a0a0c,0 18px 50px rgba(0,0,0,.75)}
.disc .lbl{position:absolute;left:50%;top:50%;width:36%;height:36%;transform:translate(-50%,-50%);border-radius:50%;background:#1e1e24 center/cover no-repeat;box-shadow:inset 0 0 0 2px rgba(0,0,0,.6)}
.disc .hole{position:absolute;left:50%;top:50%;width:3%;height:3%;transform:translate(-50%,-50%);border-radius:50%;background:#0d0d11;box-shadow:0 0 0 1px #2b2b30}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from -20deg,transparent 0deg,rgba(255,255,255,.07) 22deg,transparent 48deg,transparent 178deg,rgba(255,255,255,.05) 205deg,transparent 232deg)}
.wrapDisc{position:relative}
.parm{position:absolute;z-index:3;top:-4%;right:-16%;width:30%;height:92%;overflow:visible;pointer-events:none;display:none}
body.plate .parm{display:block}
.parm .swing{transform-origin:78px 60px;transform:rotate(-6deg);transition:transform 1.4s cubic-bezier(.4,.1,.2,1)}
body.playing .parm .swing{transform:rotate(20deg)}
.pt{font-size:clamp(13px,5vw,22px);text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa{font-size:clamp(11px,3.4vw,15px);color:#b4b4be;text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-6px}
/* Lyst træ + farvet vinyl i pladevisning */
body.plate{background:
  repeating-linear-gradient(91deg,rgba(110,62,22,.07) 0 2px,transparent 2px 11px),
  repeating-linear-gradient(89deg,rgba(255,240,210,.08) 0 1px,transparent 1px 27px),
  repeating-linear-gradient(90deg,rgba(90,50,15,.05) 0 40px,transparent 40px 95px),
  linear-gradient(90deg,#c39258,#d8b27b 22%,#c99a5f 41%,#ddb985 63%,#c6975c 82%,#d4ac74)}
body.plate .bg{display:none}
body.plate .pt{color:#3b230d;text-shadow:0 1px 0 rgba(255,235,200,.4)}
body.plate .pa{color:#5f3f1f}
body.plate .mode{background:rgba(60,35,10,.15);color:#4a2c10}
body.plate .disc{
  background:radial-gradient(circle at 50% 50%,var(--v3) 0 20.5%,var(--v1) 20.6% 21.1%,transparent 21.3%),
    repeating-radial-gradient(circle at 50% 50%,var(--v2) 0,var(--v2) 1.4px,var(--v1) 1.4px,var(--v1) 2.2px,var(--v3) 2.2px,var(--v3) 3px),var(--v1);
  box-shadow:0 0 0 2px rgba(0,0,0,.25),0 14px 34px rgba(60,30,5,.55),0 3px 8px rgba(0,0,0,.3);transition:background .8s}
body.plate .disc .lbl{width:40%;height:40%}
body.plate .disc .hole{background:#c9a06a}
.disc{--v1:#17171a;--v2:#131316;--v3:#1d1d21}
.foot{position:fixed;right:10px;bottom:4px;font-size:9px;color:#44444e;font-weight:normal}
.rl-top{padding-top:32px!important}.rl-x,.rl-nowb{top:30px!important}.rl-det{padding-top:70px!important}.rl-det .rl-back{top:30px!important}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<button class="mode" id="reolBtn" style="right:44px" onclick="openReol()" title="Pladereol (R)">▥</button>
<button class="mode" id="modeBtn" onclick="toggleMode()" title="Skift visning (P)">◉</button>
<div id="plate">
  <div class="wrapDisc"><svg class="parm" viewBox="0 0 100 260"><g class="swing"><rect x="60" y="8" width="36" height="22" rx="4" fill="#3a2a1a"/><circle cx="78" cy="60" r="11" fill="#2b2b2f" stroke="#777" stroke-width="2"/><path d="M78 60 L74 200 L52 232" fill="none" stroke="#e4e4e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(52 232) rotate(32)"><rect x="-9" y="-6" width="18" height="26" rx="3" fill="#222"/></g></g></svg><div class="disc" id="disc" onclick="cmd('toggle')" title="Afspil/pause"><div class="lbl" id="lbl"></div><div class="hole"></div></div><div class="sheen"></div></div>
  <div class="pt" id="pt">Vinyl</div>
  <div class="pa" id="pa"></div>
</div>
<div class="top">
  <div class="cov" id="cov" title="Åbn stor visning" onclick="window.open('vinyl.html','_blank')">♪</div>
  <div class="meta">
    <div>
      <div class="t" id="t">Vinyl</div>
      <div class="a" id="a">Forbinder til WiiM…</div>
      <div class="al" id="al"></div>
      <div class="prog" id="prog" onclick="seek(event)"><i id="fill"></i></div>
    </div>
    <div class="ctrl">
      <button onclick="cmd('prev')" title="Forrige">⏮</button>
      <button class="big" id="pp" onclick="cmd('toggle')" title="Afspil/pause">▶</button>
      <button onclick="cmd('next')" title="Næste">⏭</button>
      <input class="vol" id="vol" type="range" min="0" max="100" oninput="volDrag=true" onchange="volDrag=false;cmd('vol',this.value)" title="Lydstyrke">
      <span class="tm" id="tm"></span>
    </div>
  </div>
</div>
<div class="tabs" id="tabs"></div>
<div class="strip" id="strip"></div>
<div class="foot" id="foot"></div>

<script>document.write('<script src="reol.js?v='+Date.now()+'"><\/script>')</script>
<script>
var B=location.protocol==='http:'?location.origin:'http://localhost:8787';
var S={},W={pos:0,len:0,ts:0,playing:false},volDrag=false,TAB='recent',Q='',ITEMS=[],cache={},TIDAL=false,artistNow='',req=0;
try{TAB=localStorage.getItem('mini-tab')||'recent';}catch(e){}
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function get(p){return fetch(B+p,{cache:'no-store'}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('fejl '+r.status));return j;});});}
function fmt(ms){var s=Math.max(0,Math.round((ms||0)/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

// ---- Afspiller ----
var pollT=null,lastArt='';
function poll(){
  clearTimeout(pollT);
  get('/wiim/status').then(function(s){
    S=s;W={pos:s.pos||0,len:s.len||0,ts:Date.now(),playing:!!s.playing};
    $('t').textContent=s.title||'Stille';$('a').textContent=s.artist||'';$('al').textContent=s.album||'';
    $('pp').textContent=s.playing?'❚❚':'▶';document.body.classList.toggle('playing',!!s.playing);$('pt').textContent=s.title||'Stille';$('pa').textContent=[s.artist,s.album].filter(Boolean).join(' · ');
    if(!volDrag&&typeof s.vol==='number'&&!isNaN(s.vol))$('vol').value=s.vol;
    if(s.art!==lastArt){lastArt=s.art;$('cov').style.backgroundImage=s.art?'url("'+s.art+'")':'none';$('cov').textContent=s.art?'':'♪';
      $('bg').style.backgroundImage=s.art?'url("'+s.art+'")':'none';$('lbl').style.backgroundImage=s.art?'url("'+s.art+'")':'none';vinylColor(s.art,(s.album||'')+'|'+(s.artist||''));$('bg').classList.toggle('on',!!s.art);}
    document.title=s.playing&&s.title?('▶ '+s.title+(s.artist?' — '+s.artist:'')):'Vinyl Mini';
    $('foot').textContent='';
    if((s.artist||'')!==artistNow){artistNow=s.artist||'';tabs();}
    markNow();
  }).catch(function(e){$('a').textContent='WiiM-broen svarer ikke';$('foot').textContent=e.message||'';})
  .finally(function(){pollT=setTimeout(poll,2000);});
}
var ang=0,vel=0,lastT=0;
function tick(t){
  var dt=lastT?Math.min((t-lastT)/1000,.1):0;lastT=t||0;
  vel+=((W.playing?200:0)-vel)*Math.min(1,dt*(W.playing?1.6:.9));if(!W.playing&&vel<.5)vel=0;
  ang=(ang+vel*dt)%360;if(MODE==='plate')$('disc').style.transform='rotate('+ang+'deg)';
  if(W.len){var p=Math.min(W.len,W.pos+(W.playing?Date.now()-W.ts:0));$('fill').style.width=(100*p/W.len).toFixed(2)+'%';$('tm').textContent=fmt(p)+' / '+fmt(W.len);}
  else{$('fill').style.width='0';$('tm').textContent='';}
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
function cmd(c,v){
  if(c==='toggle'){W.playing=!W.playing;$('pp').textContent=W.playing?'❚❚':'▶';}
  get('/wiim/cmd?c='+c+(v!=null?'&v='+encodeURIComponent(v):'')).catch(function(){}).then(function(){clearTimeout(pollT);pollT=setTimeout(poll,350);});
}
function seek(e){if(!W.len)return;var r=e.currentTarget.getBoundingClientRect();cmd('seek',Math.round((e.clientX-r.left)/r.width*W.len/1000));}

// ---- Hylde ----
function tabs(){
  var t=[['recent','Senest spillet']];
  if(artistNow&&TIDAL)t.push(['more','Mere fra '+artistNow]);
  if(TAB==='more'&&!(artistNow&&TIDAL))TAB='recent';
  $('tabs').innerHTML=t.map(function(x){return '<button class="'+(x[0]===TAB?'on':'')+'" onclick="setTab(\''+x[0]+'\')">'+esc(x[1])+'</button>';}).join('')+
    (TIDAL?'<input id="q" type="search" placeholder="🔍 Søg i Tidal…" value="'+esc(Q)+'" onkeydown="if(event.key===\'Enter\'){Q=this.value.trim();if(Q){TAB=\'search\';load();tabsOn();}}" onfocus="this.select()">':'');
  load();
}
function tabsOn(){Array.prototype.forEach.call($('tabs').querySelectorAll('button'),function(b){b.classList.remove('on');});}
function setTab(t){TAB=t;try{localStorage.setItem('mini-tab',t);}catch(e){}tabs();}
function msg(s){ITEMS=[];$('strip').innerHTML='<div class="msg">'+s+'</div>';}
function load(){
  var key=TAB+'|'+(TAB==='more'?artistNow:TAB==='search'?Q.toLowerCase():''),r=++req,p;
  var c=cache[key];if(c&&Date.now()-c.t<(TAB==='recent'?20000:1800000))return render(c.items);
  if(TAB==='recent')p=get('/wiim/recent').then(function(l){return l.filter(function(x){return x.kind!=='other';}).map(function(x){return {album:x.album,artist:x.artist||'',art:x.art||'',tid:x.id||'',pid:x.playlistId||'',sub:x.playlistId?'Playliste':''};});});
  else if(TAB==='more')p=get('/tidal/search?q='+encodeURIComponent(artistNow)).then(function(l){var la=artistNow.toLowerCase();var own=l.filter(function(x){var xa=(x.artist||'').toLowerCase();return xa.indexOf(la)>=0||la.indexOf(xa)>=0;});return (own.length?own:l).map(function(x){return {album:x.album,artist:x.artist,art:x.art,year:x.year,tid:x.id};});});
  else if(TAB==='search')p=get('/tidal/search?q='+encodeURIComponent(Q)).then(function(l){return l.map(function(x){return {album:x.album,artist:x.artist,art:x.art,year:x.year,tid:x.id};});});
  if(!p)return msg('');
  msg('Henter…');
  p.then(function(items){if(r!==req)return;cache[key]={t:Date.now(),items:items||[]};render(items||[]);}).catch(function(e){if(r!==req)return;msg('Kunne ikke hente ('+esc(e.message)+')');});
}
function render(items){
  ITEMS=items;if(!items.length)return msg('Intet fundet.');
  $('strip').innerHTML=items.map(function(a,i){
    var cv=a.art?'<div class="c" style="background-image:url(\''+esc(a.art)+'\')"></div>':'<div class="c">'+esc(a.album)+'</div>';
    return '<div class="tile" data-i="'+i+'" title="'+esc(a.album+(a.artist?' — '+a.artist:''))+'" onclick="play('+i+',this)">'+cv+'<div class="n">'+esc(a.album)+'</div><div class="s">'+esc(a.sub||[a.artist,a.year].filter(Boolean).join(' · '))+'</div></div>';
  }).join('');
  markNow();
}
function markNow(){
  var al=(S.album||'').toLowerCase();
  Array.prototype.forEach.call(document.querySelectorAll('.tile'),function(el){var a=ITEMS[el.dataset.i];el.querySelector('.c').classList.toggle('now',!!(a&&al&&(a.album||'').toLowerCase()===al));});
}
function play(i,el){
  var a=ITEMS[i];if(!a)return;
  var p=a.pid?'/wiim/playtidal?kind=playlist&id='+encodeURIComponent(a.pid)+'&name='+encodeURIComponent(a.album)
    :a.tid?'/wiim/playtidal?id='+encodeURIComponent(a.tid)+'&name='+encodeURIComponent(a.album)+'&artist='+encodeURIComponent(a.artist||'')
    :'/wiim/playfind?artist='+encodeURIComponent(a.artist||'')+'&album='+encodeURIComponent(a.album);
  el.classList.add('busy');
  get(p).then(function(){cache={};clearTimeout(pollT);pollT=setTimeout(poll,1200);})
    .catch(function(e){$('foot').textContent=e.message||'Kunne ikke starte';})
    .finally(function(){el.classList.remove('busy');});
}
// ---- Vinylens farve: fra coverets stærkeste farve (fast pr. album), ellers tilfældig men fast ----
var colorFor='';
function hsl(h,s,l){return 'hsl('+Math.round(h)+','+Math.round(s)+'%,'+Math.round(l)+'%)';}
function setVinyl(h,s,l){var d=$('disc').style;d.setProperty('--v1',hsl(h,s,l));d.setProperty('--v2',hsl(h,s,Math.max(6,l-5)));d.setProperty('--v3',hsl(h,Math.min(100,s+4),Math.min(80,l+4)));}
function hashHue(str){var x=0;for(var i=0;i<str.length;i++)x=(x*31+str.charCodeAt(i))>>>0;return x%360;}
function vinylColor(art,key){
  if(key===colorFor)return;colorFor=key;
  var fallback=function(){setVinyl(hashHue(key||'vinyl'),62,40);};
  if(!art)return fallback();
  var img=new Image();img.crossOrigin='anonymous';
  img.onload=function(){try{
    var c=document.createElement('canvas');c.width=c.height=40;var x=c.getContext('2d');x.drawImage(img,0,0,40,40);
    var d=x.getImageData(0,0,40,40).data,bins={},best=null;
    for(var i=0;i<d.length;i+=4){var r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,dl=mx-mn;
      if(dl<.12||l<.12||l>.9)continue;var s=dl/(1-Math.abs(2*l-1)),h;
      if(mx===r)h=60*(((g-b)/dl)%6);else if(mx===g)h=60*((b-r)/dl+2);else h=60*((r-g)/dl+4);if(h<0)h+=360;
      var k=Math.round(h/20);bins[k]=bins[k]||{n:0,h:0,s:0};bins[k].n+=s;bins[k].h+=h*s;bins[k].s+=s*s;}
    for(var k in bins)if(!best||bins[k].n>best.n)best=bins[k];
    if(!best||best.n<8)return fallback();
    setVinyl(best.h/best.n,Math.min(85,Math.max(45,100*best.s/best.n)),38);
  }catch(e){fallback();}};
  img.onerror=fallback;img.src=B+'/img?u='+encodeURIComponent(art);
}
// ---- Visning: fuld / kun plade ----
var MODE='full';try{MODE=localStorage.getItem('mini-mode')||'full';}catch(e){}
function applyMode(){document.body.classList.toggle('plate',MODE==='plate');$('modeBtn').textContent=MODE==='plate'?'☰':'◉';$('modeBtn').title=MODE==='plate'?'Vis afspiller og hylde (P)':'Vis kun pladen (P)';
  try{window.webkit.messageHandlers.mode.postMessage(MODE);}catch(e){}}
function toggleMode(){MODE=MODE==='plate'?'full':'plate';try{localStorage.setItem('mini-mode',MODE);}catch(e){}applyMode();}
// Mellemrum = afspil/pause, piletaster = forrige/næste (når søgefeltet ikke er i fokus)
document.addEventListener('keydown',function(e){
  if(document.activeElement&&document.activeElement.id==='q')return;
  if(e.key===' '){e.preventDefault();cmd('toggle');}
  else if(e.key==='p'||e.key==='P')toggleMode();
  else if(e.key==='r'||e.key==='R')openReol();
  else if(e.key==='ArrowRight')cmd('next');else if(e.key==='ArrowLeft')cmd('prev');
});
function openReol(){Reol.init({base:B});Reol.open();}
applyMode();
get('/tidal/status').then(function(j){TIDAL=!!j.ok;}).catch(function(){}).finally(function(){tabs();poll();});
</script>
</body>
</html>
