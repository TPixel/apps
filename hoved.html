<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoved">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C0C12">
<title>Hoved — alt ud af hovedet</title>
<link rel="apple-touch-icon" href="hoved-touch.png">
<link rel="icon" type="image/png" href="hoved-favicon.png">
<link rel="manifest" href="hoved.webmanifest">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0C0C12;color:#fff;font-family:'Tahoma',sans-serif;font-weight:bold;min-height:100dvh;padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.logo{font-size:12px;color:#555;letter-spacing:1px;text-transform:uppercase}
h1{font-size:26px;margin-top:2px;display:flex;align-items:center;gap:8px}
.dash{color:#E8820A;font-size:13px;text-decoration:none;padding:8px 0}
.box{background:#1a1a24;border-radius:16px;padding:12px;border:2px solid transparent}
.box.rec{border-color:#f87171;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{border-color:#7a2020}}
textarea{width:100%;min-height:110px;background:transparent;border:none;color:#fff;font-size:18px;font-family:inherit;font-weight:bold;resize:none;outline:none;line-height:1.35}
textarea::placeholder{color:#555}
.interim{color:#888;font-size:14px;min-height:18px;margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:20px;background:#1a1a24;color:#aaa;font-size:14px;border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.chip.on{background:#E8820A;color:#fff;border-color:#E8820A}
.chip.p1{color:#f87171}
.chips.small .chip{font-size:12px;padding:6px 10px}
.row{display:flex;gap:10px;margin-top:6px}
.btn{padding:16px;border-radius:14px;border:none;font-family:inherit;font-weight:bold;font-size:17px;color:#fff;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.send{flex:1;background:#E8820A}
.btn.send:disabled{background:#3a2a12;color:#8a6a3a}
.btn.mic{width:64px;background:#2a2a38;font-size:24px}
.btn.mic.rec{background:#f87171}
.toast{margin-top:14px;background:#16321f;color:#4ade80;border-radius:12px;padding:12px 14px;font-size:14px;display:none;line-height:1.4}
.toast.show{display:block}
.toast.err{background:#3a1a1a;color:#f87171}
.toast .sub{color:#8fd9a5;font-size:12px;margin-top:3px;font-weight:normal}
h2{font-size:13px;color:#666;text-transform:uppercase;letter-spacing:1px;margin:24px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:#1a1a24;border-radius:12px;padding:10px 12px;border-left:4px solid #333;font-size:14px}
.card.p1{border-left-color:#f87171}
.card.done{opacity:.45;text-decoration:line-through}
.card .t{font-size:15px}
.card .m{font-size:12px;color:#888;margin-top:4px;font-weight:normal;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.b{display:inline-block;background:#2a2a38;color:#bbb;border-radius:6px;padding:1px 6px;font-size:11px}
.b.k{background:#E8820A22;color:#E8820A}
.b.d{color:#FBBF24}
.card .ok{float:right;background:none;border:none;color:#4ade80;font-size:20px;cursor:pointer;padding:0 0 0 10px}
.queue{font-size:12px;color:#FBBF24;margin-top:8px;display:none}
.queue.show{display:block}
.empty{color:#555;font-size:14px;padding:20px 0;text-align:center}
</style>
</head>
<body>
<div class="top">
  <div><div class="logo">Ditzel &amp; Co</div><h1>🧠 Hoved</h1></div>
  <a class="dash" href="hoved-dash.html">Dashboard →</a>
</div>

<div class="box" id="box">
  <textarea id="txt" placeholder="Skriv eller tal… fx “betal elregning inden fredag #betal #nu”" rows="4" autocomplete="off" autocapitalize="sentences"></textarea>
  <div class="interim" id="interim"></div>
</div>

<div class="chips" id="chips"></div>
<div class="chips small" id="chips2"></div>

<div class="row">
  <button class="btn mic" id="mic" title="Tal">🎤</button>
  <button class="btn send" id="send">Send</button>
</div>
<div class="queue" id="queue"></div>
<button id="kick" style="background:transparent;border:none;color:#E8820A;font-family:inherit;font-weight:bold;font-size:14px;padding:12px 0 0;cursor:pointer">▶️ Bed Claude behandle nu</button>
<div class="toast" id="toast"></div>

<h2>Seneste</h2>
<div class="list" id="list"><div class="empty">Henter…</div></div>

<script>
const API = 'https://lightcrew-api.thomas-5c5.workers.dev';
const $ = id => document.getElementById(id);
const txt = $('txt'), toast = $('toast');

// ---- Chips (grov-sortering) ----
const HANDLING = ['#betal','#bestil','#hent','#ring','#køb','#tjek','#skriv','#undersøg'];
const KAT = ['#nu','#idé','#projekt','#butik','#kalender','#personlig','#timeapp','#dmx','#lightcrew','#hjem','#familie','#bil','#engang'];
function chip(t, parent) {
  const c = document.createElement('div'); c.className = 'chip' + (t === '#nu' ? ' p1' : ''); c.textContent = t;
  c.onclick = () => { toggleTag(t); syncChips(); txt.focus(); };
  parent.appendChild(c);
}
HANDLING.forEach(t => chip(t, $('chips'))); KAT.forEach(t => chip(t, $('chips2')));
function toggleTag(t) {
  const re = new RegExp('(^|\\s)' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=\\s|$)', 'iu');
  if (re.test(txt.value)) txt.value = txt.value.replace(re, '').replace(/\s{2,}/g, ' ').trim();
  else txt.value = (txt.value.trim() + ' ' + t).trim();
}
function syncChips() {
  const v = txt.value.toLowerCase();
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', new RegExp('(^|\\s)' + c.textContent + '(?=\\s|$)', 'u').test(v)));
  $('send').disabled = !txt.value.trim();
}
txt.addEventListener('input', () => { syncChips(); autoGrow(); });
function autoGrow() { txt.style.height = 'auto'; txt.style.height = Math.max(110, txt.scrollHeight) + 'px'; }
txt.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') send(); });

// ---- Diktering (Web Speech API, virker i Safari iOS/Mac + Chrome) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recOn = false, baseText = '';
if (!SR) { $('mic').style.display = 'none'; }
else {
  $('mic').onclick = () => recOn ? stopRec() : startRec();
}
function startRec() {
  rec = new SR(); rec.lang = 'da-DK'; rec.continuous = true; rec.interimResults = true;
  baseText = txt.value.trim(); let finalText = '';
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += (finalText ? ' ' : '') + r[0].transcript.trim();
      else interim += r[0].transcript;
    }
    txt.value = [baseText, finalText].filter(Boolean).join(' ');
    $('interim').textContent = interim;
    syncChips(); autoGrow();
  };
  rec.onerror = e => { showToast('Mikrofon: ' + e.error, true); stopRec(); };
  rec.onend = () => { if (recOn) { try { rec.start(); } catch (e) { stopRec(); } } };
  try { rec.start(); recOn = true; $('mic').classList.add('rec'); $('box').classList.add('rec'); $('mic').textContent = '⏹'; }
  catch (e) { showToast('Kunne ikke starte mikrofon', true); }
}
function stopRec() {
  recOn = false; $('mic').classList.remove('rec'); $('box').classList.remove('rec'); $('mic').textContent = '🎤'; $('interim').textContent = '';
  try { rec && rec.stop(); } catch (e) {}
}

// ---- Send (m. offline-kø) ----
const QKEY = 'hoved_queue';
const kilde = /iPhone|iPad/.test(navigator.userAgent) ? (/iPad/.test(navigator.userAgent) ? 'ipad' : 'iphone') : 'mac';
$('send').onclick = send;
async function send() {
  const tekst = txt.value.trim(); if (!tekst) return;
  if (recOn) stopRec();
  $('send').disabled = true; $('send').textContent = '…';
  try {
    const r = await post(tekst);
    txt.value = ''; syncChips(); autoGrow();
    const f = r.entry || {};
    showToast('✅ Gemt' + (f.kategori ? ' → ' + f.kategori : '') + (f.handling ? ' · ' + f.handling : '') + (f.projekt ? ' · ' + f.projekt : '') + (f.prioritet === 1 ? ' · 🔴 NU' : ''),
      false, f.sorteret_af === 'ai' ? (f.titel + (f.deadline ? ' · frist ' + f.deadline : '') + (f.begrundelse ? ' — ' + f.begrundelse : '')) : 'Grov-sorteret efter tags — Claude finsorterer senere');
    load();
  } catch (e) {
    queueAdd(tekst); txt.value = ''; syncChips(); autoGrow();
    showToast('📴 Ingen forbindelse — gemt lokalt, sendes når der er net', true);
  }
  $('send').textContent = 'Send'; $('send').disabled = !txt.value.trim();
}
async function post(tekst) {
  const r = await fetch(API + '/api/hoved', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ tekst, kilde }) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function queueGet() { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; } }
function queueAdd(t) { const q = queueGet(); q.push({ t, ts: Date.now() }); localStorage.setItem(QKEY, JSON.stringify(q)); showQueue(); }
function showQueue() { const q = queueGet(); $('queue').classList.toggle('show', q.length > 0); $('queue').textContent = q.length ? '⏳ ' + q.length + ' venter på at blive sendt' : ''; }
async function flushQueue() {
  const q = queueGet(); if (!q.length) return;
  const rest = [];
  for (const it of q) { try { await post(it.t); } catch (e) { rest.push(it); } }
  localStorage.setItem(QKEY, JSON.stringify(rest)); showQueue();
  if (rest.length < q.length) { showToast('✅ ' + (q.length - rest.length) + ' ventende sendt'); load(); }
}
window.addEventListener('online', flushQueue);

let toastT;
function showToast(msg, err, sub) {
  toast.className = 'toast show' + (err ? ' err' : '');
  toast.innerHTML = esc(msg) + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '');
  clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('show'), err ? 6000 : 5000);
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- Seneste ----
async function load() {
  try {
    const r = await fetch(API + '/api/hoved?status=alle&limit=12'); const rows = await r.json();
    rows.sort((a, b) => b.id - a.id);
    $('list').innerHTML = rows.length ? rows.map(card).join('') : '<div class="empty">Tomt — skriv din første tanke</div>';
  } catch (e) { $('list').innerHTML = '<div class="empty">Kunne ikke hente</div>'; }
}
function card(r) {
  const done = r.status === 'udfoert';
  return `<div class="card${r.prioritet === 1 ? ' p1' : ''}${done ? ' done' : ''}">
    ${done ? '' : `<button class="ok" title="Udført" onclick="udfoert(${r.id})">✓</button>`}
    <div class="t">${esc(r.titel || r.tekst)}</div>
    <div class="m">${r.kategori ? `<span class="b k">${esc(r.kategori)}</span>` : '<span class="b">usorteret</span>'}${r.handling ? `<span class="b">${esc(r.handling)}</span>` : ''}${r.projekt ? `<span class="b">${esc(r.projekt)}</span>` : ''}${r.deadline ? `<span class="b d">📅 ${esc(r.deadline)}</span>` : ''}<span>${esc(r.oprettet.slice(5, 16))}</span></div>
  </div>`;
}
async function udfoert(id) {
  await fetch(API + '/api/hoved/' + id, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ status: 'udfoert' }) });
  load();
}

// ---- Kør Claude nu ----
$('kick').onclick = async () => {
  const b = $('kick'); b.disabled = true; b.textContent = '⏳ Starter Claude…';
  try {
    const r = await fetch(API + '/api/hoved/kick', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok !== false) { showToast('🚀 Claude behandler nu — se resultatet på dashboardet om et par minutter'); setTimeout(load, 90000); }
    else if (r.status === 404) showToast('⚠️ Workeren mangler /api/hoved/kick — bed Claude på Mac’en tilføje den', true);
    else showToast('Fejl: ' + (d.error || 'HTTP ' + r.status), true);
  } catch (e) { showToast('Offline — prøv igen', true); }
  b.disabled = false; b.textContent = '▶️ Bed Claude behandle nu';
};

// ---- Init ----
const params = new URLSearchParams(location.search);
if (params.get('t')) { txt.value = params.get('t'); }  // ?t=... fra Genveje/share
syncChips(); autoGrow(); showQueue(); flushQueue(); load();
setTimeout(() => txt.focus(), 100);
</script>
</body>
</html>
