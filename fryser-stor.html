<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fryser · Store labels (Avery 99×68, 8 pr. ark)</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* ===== Avery 99,1 × 67,7 mm — 2 × 4 = 8 pr. A4 (L7165/J8165) ===== */
:root{
  --lw:99.1mm; --lh:67.7mm; --mtop:13mm; --mside:4.65mm; --colgap:2.5mm;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#e9e9ee;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;color:#111}
.controls{position:sticky;top:0;z-index:10;background:#0C0C12;color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.controls .logo{font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-right:8px}
.controls h1{font-size:16px;font-weight:bold;margin-right:auto}
.btn{padding:9px 16px;border-radius:9px;border:none;font-weight:bold;font-size:14px;cursor:pointer;font-family:inherit}
.btn.print{background:#E8820A;color:#fff}
.btn.new{background:#2a2a38;color:#fff}
.hint{width:100%;color:#999;font-size:12px}
.wrap{display:flex;justify-content:center;padding:16px}
.sheet{
  width:210mm;height:297mm;background:#fff;overflow:hidden;
  padding:var(--mtop) var(--mside) 0;
  display:grid;grid-template-columns:repeat(2,var(--lw));column-gap:var(--colgap);row-gap:0;
  grid-auto-rows:var(--lh);justify-content:start;align-content:start;
  box-shadow:0 2px 14px rgba(0,0,0,.18);
}
.label{position:relative;width:var(--lw);height:var(--lh);break-inside:avoid;page-break-inside:avoid}
.vare{position:absolute;left:3.4mm;top:6.6mm;font-size:18pt;font-weight:bold;color:#111;letter-spacing:.2px}
.qr{position:absolute;left:67.6mm;top:6.4mm;width:25mm;height:25mm}
.qr svg{width:100%;height:100%;display:block}
.r1{position:absolute;left:3.6mm;top:43.5mm;width:84.5mm;display:flex;justify-content:space-between;font-size:8pt;font-weight:bold}
.r2{position:absolute;left:3.6mm;top:50.2mm;display:flex;gap:7mm;font-size:8pt;font-weight:bold}
.vaegt{position:absolute;left:3.6mm;top:59mm;font-size:11pt;font-weight:bold}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .controls,.hint{display:none}
  .wrap{padding:0}
  .sheet{box-shadow:none}
}
</style>
</head>
<body>
<div class="controls">
  <span class="logo">Ditzel &amp; Co</span>
  <h1>🧊 Store labels · Avery 99×68</h1>
  <button class="btn new" onclick="build()">🔄 Nyt ark (nye koder)</button>
  <button class="btn print" onclick="window.print()">🖨️ Print</button>
  <div class="hint">8 labels pr. A4 (99,1 × 67,7 mm — Avery L7165/J8165). Hver label har en unik QR-kode der matcher fryser-appen. <b>Print:</b> Margener = Ingen, Skala = 100 % (ikke “tilpas til side”), sidehoved/-fod fra. Testprint på alm. papir mod Avery-arket først.</div>
</div>
<div class="wrap"><div class="sheet" id="sheet"></div></div>

<script>
// Faste kategori-farver
var CAT=[
  ['KØD','#C0143C'],['FISK','#1565C0'],['FJERKRÆ','#B26A00'],['GRØNT','#1B7A3A'],['FRUGT','#D24726'],
  ['DESSERT','#9C1C86'],['FÆRDIG RET','#0E7C7B'],['BRØD','#7A5230']
];

function kode(){
  var cs='ACDEFGHJKMNPQRTUVWXYZ2346789',out='';
  var a=new Uint8Array(6);
  if(window.crypto&&crypto.getRandomValues){crypto.getRandomValues(a);}
  else{for(var j=0;j<6;j++)a[j]=Math.floor(Math.random()*256);}
  for(var i=0;i<6;i++)out+=cs[a[i]%cs.length];
  return out;
}
function qrSvg(txt,color){
  var q=qrcode(0,'M');q.addData(txt);q.make();
  var svg=q.createSvgTag({cellSize:4,margin:2,scalable:true});
  return svg.replace(/<path/g,'<path fill="'+color+'"');
}
function cat(name,color){return '<span style="color:'+color+'">'+name+'</span>';}

function build(){
  var sheet=document.getElementById('sheet');sheet.innerHTML='';
  for(var i=0;i<8;i++){
    var c=kode();
    var col='#000000';   // QR (og Vægt) sort — scanner mest sikkert
    var r1='',r2='';
    for(var k=0;k<5;k++) r1+=cat(CAT[k][0],CAT[k][1]);
    for(var k=5;k<8;k++) r2+=cat(CAT[k][0],CAT[k][1]);
    var el=document.createElement('div');el.className='label';
    el.innerHTML=
      '<div class="vare">Vare:</div>'+
      '<div class="qr">'+qrSvg(c,col)+'</div>'+
      '<div class="r1">'+r1+'</div>'+
      '<div class="r2">'+r2+'</div>'+
      '<div class="vaegt" style="color:'+col+'">Vægt:</div>';
    sheet.appendChild(el);
  }
}
build();
</script>
</body>
</html>
