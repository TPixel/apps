<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ditzel Apps">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C0C12">
<title>Ditzel &amp; Co — Apps</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0C0C12;color:#fff;font-family:'Tahoma',sans-serif;font-weight:bold;min-height:100dvh;padding:28px 18px calc(28px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.logo{font-size:12px;color:#555;letter-spacing:1px;text-transform:uppercase}
h1{font-size:30px;margin:2px 0 4px}
.tag{font-size:14px;color:#777;margin-bottom:26px}
.grid{display:flex;flex-direction:column;gap:12px}
a.app{display:flex;align-items:center;gap:16px;background:#1a1a24;border-radius:16px;padding:18px 18px;text-decoration:none;color:#fff;border-left:4px solid #E8820A}
a.app:active{transform:scale(.98)}
.app .emoji{font-size:34px;line-height:1}
.app .txt{flex:1;min-width:0}
.app .navn{font-size:19px}
.app .desc{font-size:13px;color:#888;margin-top:3px;font-weight:bold}
.app .arrow{color:#E8820A;font-size:22px}
.foot{margin-top:32px;font-size:12px;color:#444;text-align:center}
</style>
</head>
<body>
<div class="logo">Ditzel &amp; Co</div>
<h1>Apps</h1>
<div class="tag">Små værktøjer og sideprojekter</div>

<div class="grid">
  <a class="app" href="hoved.html">
    <div class="emoji">🧠</div>
    <div class="txt"><div class="navn">Hoved</div><div class="desc">Alt ud af hovedet — skriv eller tal, AI sorterer</div></div>
    <div class="arrow">›</div>
  </a>
  <a class="app" href="hoved-dash.html">
    <div class="emoji">📋</div>
    <div class="txt"><div class="navn">Hoved · Dashboard</div><div class="desc">Alle tanker sorteret i lister og projekter</div></div>
    <div class="arrow">›</div>
  </a>
  <a class="app" href="fryser.html">
    <div class="emoji">🧊</div>
    <div class="txt"><div class="navn">Fryseren</div><div class="desc">Hvad er der i fryseren? Scan QR, find og tag ud</div></div>
    <div class="arrow">›</div>
  </a>
</div>

<div class="foot">ditzel &amp; co</div>
</body>
</html>
